# Replay /data/in.jsonl into the Receiver, write what it returns split by routeState.
[SERVICE]
    Flush        1
    Log_Level    info
    Grace        10
    Parsers_File /fluent-bit/etc/parsers.conf

[INPUT]
    Name              tail
    Path              /data/in.jsonl
    Parser            json
    Read_from_Head    On
    Refresh_Interval  1
    Tag               app.check
    DB                /data/tail.db

# One worker and one keepalive connection: the Receiver's forward input serves one client.
[OUTPUT]
    Name                        forward
    Match                       app.*
    Host                        fdcheck-tenx
    Port                        24224
    Retry_Limit                 False
    Workers                     1
    net.max_worker_connections  1
    net.keepalive               on
    net.keepalive_max_recycle   100000000
    net.keepalive_idle_timeout  300

[INPUT]
    Name        forward
    Listen      0.0.0.0
    Port        24225
    Tag_Prefix  tenx.

[FILTER]
    Name   lua
    Match  tenx.*
    call   route
    code   function route(tag,ts,rec) local r=rec["routeState"] if r=="pass" then rec["_route"]="pass" else rec["_route"]="moved" end return 2,ts,rec end

[FILTER]
    Name    rewrite_tag
    Match   tenx.*
    Rule    $_route ^pass$  routed.pass  false
    Rule    $_route ^moved$ routed.moved false

[OUTPUT]
    Name    file
    Match   routed.pass
    Path    /data
    File    pass.jsonl
    Format  plain

[OUTPUT]
    Name    file
    Match   routed.moved
    Path    /data
    File    moved.jsonl
    Format  plain
