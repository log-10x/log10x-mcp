[SERVICE]
    Flush 1
    Log_Level info
    Daemon Off
    Parsers_File /fluent-bit/etc/parsers.conf

# Tag `tenx.app` so the engine's return path carries the same tag and the
# shipped recipe's `Match tenx.*` filters apply verbatim downstream.
[INPUT]
    Name        tail
    Path        /data/cxtest.log
    Tag         tenx.app
    Read_from_Head On
    Parser      json
    Path_Key    src

[OUTPUT]
    Name  forward
    Match tenx.*
    Host  host.docker.internal
    Port  24224
