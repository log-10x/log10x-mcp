[SERVICE]
    Flush 1
    Grace 5
    Log_Level info
    Daemon Off

# The engine's return path lands here.
[INPUT]
    Name   forward
    Listen 0.0.0.0
    Port   24225

# ---- from fluentBitCoralogixRecipe() ----------------------------------------
[FILTER]
    Name    lua
    Match   tenx.*
    call    tag_route
    code    function tag_route(tag,ts,rec) local r=rec["routeState"] if r=="offload" then rec["_route"]="offload" elseif r=="drop" then rec["_route"]="drop" else rec["_route"]="siem" end return 2,ts,rec end

[FILTER]
    Name    rewrite_tag
    Match   tenx.*
    Rule    $_route ^offload$ tenx.offload true
    Rule    $_route ^drop$    tenx.drop    true

[FILTER]
    Name    grep
    Match   tenx.app
    Regex   _route ^siem$

[FILTER]
    Name    lua
    Match   tenx.app
    call    cx_singles
    code    function cx_singles(tag,ts,rec) local r=rec["routeState"] rec["_route"]=nil local out={} out["applicationName"]="tenx-e2e" out["subsystemName"]=(r=="tier_down") and "tier_down" or "app" out["severity"]=3 out["text"]=rec return 2,ts,out end

[OUTPUT]
    Name       http
    Match      tenx.app
    Host       ingress.cx498.coralogix.com
    Port       443
    URI        /logs/v1/singles
    Format     json
    json_date_key false
    tls        On
    tls.verify On
    Header     Authorization Bearer ${CORALOGIX_SEND_KEY}

[OUTPUT]
    Name  null
    Match tenx.drop
